# Shopify Partner Dashboard values must be supplied before registration.
# OAuth and webhook handlers run as Cloudflare Pages Functions.
client_id = "SET_WITH_SHOPIFY_PARTNER"
name = "NODUS"
application_url = "https://nodus-hq.pages.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = ["https://nodus-hq.pages.dev/api/shopify/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/webhooks"
