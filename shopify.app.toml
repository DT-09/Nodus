# Replace client_id with the Shopify Partner Dashboard client ID before registration.
# Configure the matching client secret and encryption key as Cloudflare Pages secrets.
client_id = "SET_WITH_SHOPIFY_PARTNER"
name = "NODUS"
application_url = "https://nodus-hq.pages.dev/workspace"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders"

[auth]
redirect_urls = ["https://nodus-hq.pages.dev/api/shopify/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/api/shopify/webhooks"
