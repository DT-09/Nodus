# PLACEHOLDER ONLY.
# The Cloudflare public release does not yet implement Shopify OAuth callbacks or sessions.
# Do not register or distribute this app until the Cloudflare OAuth runtime and webhook tests pass.
client_id = "SET_WITH_SHOPIFY_PARTNER"
name = "NODUS"
application_url = "https://nodus-hq.pages.dev"
embedded = true

[build]
automatically_update_urls_on_dev = false

[access_scopes]
scopes = "read_orders,read_products,read_fulfillments,read_shipping,read_markets"

[auth]
redirect_urls = ["https://nodus-hq.pages.dev/auth/callback"]

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["app/scopes_update"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "/webhooks"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "/webhooks"
