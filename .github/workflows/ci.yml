name: NODUS CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nodus
          POSTGRES_PASSWORD: nodus
          POSTGRES_DB: nodus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodus -d nodus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nodus:nodus@localhost:5432/nodus?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10.9.x has a known Arborist peer-resolution crash with Vitest's
      # optional peer graph. Pin the fixed resolver instead of bypassing peers.
      - name: Pin npm resolver
        run: |
          npm install --global npm@11.6.0
          npm --version
      - name: Resolve dependency lockfile
        run: npm install --ignore-scripts --package-lock-only || (cat ~/.npm/_logs/*debug-0.log; exit 1)
      - name: Commit reproducible dependency lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: commit resolved npm lockfile [skip ci]"
            git push
          fi
      - name: Capture dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Upload generated lockfile and dependency audit
        uses: actions/upload-artifact@v4
        with:
          name: nodus-dependency-audit
          path: |
            package-lock.json
            npm-audit.json
            npm-audit-production.json
          retention-days: 7
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -t nodus:ci .
