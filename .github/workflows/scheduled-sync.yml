name: NODUS scheduled sync

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nodus-scheduled-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check production sync configuration
        id: config
        env:
          NODUS_BASE_URL: ${{ secrets.NODUS_BASE_URL }}
          NODUS_CRON_SECRET: ${{ secrets.NODUS_CRON_SECRET }}
        run: |
          if [ -z "$NODUS_BASE_URL" ] || [ -z "$NODUS_CRON_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Production sync is not configured; add NODUS_BASE_URL and NODUS_CRON_SECRET repository secrets."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run protected merchant sync
        if: steps.config.outputs.configured == 'true'
        env:
          NODUS_BASE_URL: ${{ secrets.NODUS_BASE_URL }}
          NODUS_CRON_SECRET: ${{ secrets.NODUS_CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${NODUS_BASE_URL%/}"
          case "$BASE_URL" in
            https://*) ;;
            *) echo "NODUS_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 55 \
            -H "Authorization: Bearer $NODUS_CRON_SECRET" \
            "$BASE_URL/api/cron/sync"
